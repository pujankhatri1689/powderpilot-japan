name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Type-Check, Lint, Validate & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate data & asset integrity
        run: npm run validate

      # next-env.d.ts and Next.js route types (LayoutProps/PageProps etc.) are
      # generated, gitignored artifacts. Generate them before type-checking or a
      # fresh checkout fails with "Cannot find name 'LayoutProps'".
      # `npm run typecheck` = `next typegen && tsc --noEmit`.
      - name: Generate Next.js route types & type-check
        run: npm run typecheck

      - name: ESLint
        run: npx eslint src

      - name: Production build
        run: npm run build
